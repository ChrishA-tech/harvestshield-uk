[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestshield-uk"
version = "0.1.0"
description = "UK Crop Yield & Supply Chain Disruption Forecasting, Multispectral Satellite Crop Stress AI, and Defra BTOM / FSA Border Biosecurity Compliance Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "mapie>=0.8",
    "torch>=2.2",
    "pandera>=0.20",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "mlflow>=2.14",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
ui = [
    "streamlit>=1.36",
    "tabulate>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
