<body>
<nav><a href="https://chrisha-tech.github.io/">Chrish Pep Felix A</a><a id="repo" href="https://github.com/ChrishA-tech">GitHub repository</a></nav>
<main>
<header class="hero"><p class="domain" id="domain">Interactive portfolio</p><h1 id="title">UK Decision Replay</h1><p id="subtitle" class="lead"></p></header>
<p id="failure" role="alert" class="panel hidden"></p>
<div id="interactive" class="hidden">
<div class="filters panel">
<label>Project<select id="project"></select></label>
<label>Region or group<select id="group"></select></label>
<label>Scenario<select id="scenario"></select></label>
</div>
<p id="scope" class="scope"></p>
<section class="scores" aria-label="Results" aria-live="polite">
<div class="panel"><span id="base-label"></span><strong id="baseline"></strong><span class="muted" id="units"></span></div>
<div class="panel"><span id="candidate-label"></span><strong id="candidate"></strong><span class="muted">Lower is better</span></div>
<div class="panel"><span>Candidate wins</span><strong id="wins"></strong><span class="muted" id="count"></span></div>
</section>
<section class="panel chart">
<div class="row"><h2>Replay by case</h2><button id="download" type="button">Export visible cases</button></div>
<canvas id="chart" role="img" aria-label="Baseline and candidate scores by replay case. Values are available in the table."></canvas>
<div class="legend"><span id="base-legend"></span><span id="candidate-legend"></span></div>
<p class="state" id="status" aria-live="polite"></p>
</section>
<section class="panel details">
<h2>Where the candidate struggled</h2>
<p id="analysis"></p>
<div class="scroll"><table><thead><tr><th scope="col">Case</th><th scope="col">Group</th><th scope="col">Scenario</th><th scope="col">Baseline</th><th scope="col">Candidate</th></tr></thead><tbody id="cases"></tbody></table></div>
</section>
</div>
<noscript><p class="panel">Enable JavaScript to explore the replay. The source and benchmark documentation are available on GitHub.</p></noscript>
</main>

<script>
'use strict';
const el = id => document.getElementById(id);
const number = new Intl.NumberFormat('en-GB',{maximumFractionDigits:3});
const fmt = value => Number.isFinite(value) ? number.format(value) : '—';
let catalogue, selected, cases=[];
function options(target, entries) {
  target.replaceChildren(...entries.map(([value,label]) => new Option(label,value)));
}
function plot() {
  const canvas=el('chart'), ctx=canvas.getContext('2d');
  if (!ctx) return;
  const w=canvas.clientWidth,h=canvas.clientHeight, scale=window.devicePixelRatio || 1;
  canvas.width=w*scale; canvas.height=h*scale; ctx.scale(scale,scale);
  if (!cases.length || w<65) return;
  const colors=getComputedStyle(document.documentElement);
  const yValues=cases.flatMap(row=>[row.baseline,row.candidate]);
  const min=Math.min(0,...yValues), max=Math.max(...yValues,min+.001);
  const x=i=>44+(w-56)*(cases.length===1 ? .5 : i/(cases.length-1));
  const y=v=>h-22-(h-38)*(v-min)/(max-min);
  ctx.font='12px system-ui';
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4;
    ctx.strokeStyle=colors.getPropertyValue('--line'); ctx.beginPath();ctx.moveTo(44,y(v));ctx.lineTo(w-12,y(v));ctx.stroke();
    ctx.fillStyle=colors.getPropertyValue('--sub');ctx.fillText(fmt(v),0,y(v)+4);
  }
  for(const [key,variable] of [['baseline','--base'],['candidate','--candidate']]){
    ctx.strokeStyle=ctx.fillStyle=colors.getPropertyValue(variable);ctx.lineWidth=2;
    ctx.beginPath();cases.forEach((row,i)=>i?ctx.lineTo(x(i),y(row[key])):ctx.moveTo(x(i),y(row[key])));ctx.stroke();
    if(cases.length===1){ctx.beginPath();ctx.arc(x(0),y(cases[0][key]),4,0,Math.PI*2);ctx.fill();}
  }
}
function render() {
  const group=el('group').value, scenario=el('scenario').value;
  cases=selected.cases.filter(row=>(!group||row.group===group)&&(!scenario||row.scenario===scenario));
  const mean=key=>cases.length?cases.reduce((sum,row)=>sum+row[key],0)/cases.length:NaN;
  const wins=cases.filter(row=>row.candidate<row.baseline-1e-8).length;
  const losses=cases.filter(row=>row.candidate>row.baseline+1e-8).sort((a,b)=>(b.candidate-b.baseline)-(a.candidate-a.baseline));
  el('baseline').textContent=fmt(mean('baseline'));el('candidate').textContent=fmt(mean('candidate'));
  el('wins').textContent=cases.length?Math.round(100*wins/cases.length)+'%':'—';
  el('count').textContent=cases.length+' replay cases';
  el('status').textContent=cases.length?selected.provenance:'No cases match these filters. Choose another group or scenario.';
  const worst=losses[0];
  el('analysis').textContent=worst?`The candidate scored worse in ${losses.length} of ${cases.length} cases. The largest gap was ${fmt(worst.candidate-worst.baseline)} in case ${worst.period} (${worst.scenario}, ${worst.group}).`:cases.length?'The candidate had no higher scores in this selection. Check other scenarios to see where it loses.':'Change the filters to inspect results.';
  el('download').disabled = !cases.length;
  el('cases').replaceChildren(...(losses.length?losses:cases).slice(0,5).map(row=>{
    const tr=document.createElement('tr');
    for(const value of [row.period,row.group,row.scenario,fmt(row.baseline),fmt(row.candidate)]) tr.insertCell().textContent=value;
    return tr;
  }));
  plot();
}
function setProject() {
  selected=catalogue.find(row=>row.config.slug===el('project').value) || catalogue[0];
  const c=selected.config;
  for(const [id,value] of Object.entries({title:c.name,domain:c.domain,subtitle:c.subtitle,scope:c.note,units:c.units,'base-label':c.baseline,'base-legend':c.baseline,'candidate-label':c.candidate,'candidate-legend':c.candidate})) el(id).textContent=value;
  el('repo').href='https://github.com/ChrishA-tech/'+c.slug;
  options(el('group'),[['','All groups'],...[...new Set(selected.cases.map(row=>row.group))].map(value=>[value,value])]);
  options(el('scenario'),[['','All scenarios'],...[...new Set(selected.cases.map(row=>row.scenario))].map(value=>[value,value])]);
  render();
}
try {
  catalogue=JSON.parse(el('data').textContent);
  if(!Array.isArray(catalogue)||!catalogue.length||catalogue.some(item=>!item.config||!Array.isArray(item.cases))) throw Error('Invalid replay data');
  options(el('project'),catalogue.map(row=>[row.config.slug,row.config.name]));
  const requested=new URLSearchParams(location.search).get('project');
  if(catalogue.some(row=>row.config.slug===requested)) el('project').value=requested;
  el('interactive').classList.remove('hidden');
  setProject();
  el('project').addEventListener('change',setProject);
  ['group','scenario'].forEach(id=>el(id).addEventListener('change',render));
  window.addEventListener('resize',plot);
  el('download').addEventListener('click',()=>{
    const quote=value=>'"'+String(value).replaceAll('"','""')+'"';
    const lines=cases.map(row=>[row.period,row.group,row.scenario,row.baseline,row.candidate,selected.provenance].map(quote).join(','));
    const url=URL.createObjectURL(new Blob(['case,group,scenario,baseline_score,candidate_score,provenance\n'+lines.join('\n')],{type:'text/csv'}));
    const link=document.createElement('a');link.href=url;link.download=selected.config.slug+'-replay.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
} catch(error) {
  el('interactive').classList.add('hidden');
  el('failure').textContent='Replay data could not be loaded. Reload the page or check the repository for a fresh dashboard.';
  el('failure').classList.remove('hidden');
}
</script>
